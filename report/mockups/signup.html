<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudySinc — Sign Up (Mockup)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f0;
      --surface: #fcfaf7;
      --surface-2: #edeae3;
      --fg: #2d2a26;
      --muted: #6e6a63;
      --border: #e6e1d8;
      --accent: #c7802a;
      --accent-hover: #b5721f;
      --on-accent: #fffdf8;
      --radius-card: 10px;
      --radius-control: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .card {
      width: min(460px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 32px;
      box-shadow: 0 1px 2px rgba(30,25,15,0.04);
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      font-family: 'Geologica', sans-serif;
      font-weight: 600;
      font-size: 18px;
    }
    .logo-text {
      font-family: 'Geologica', sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    h1 {
      font-family: 'Geologica', sans-serif;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: -0.015em;
      margin: 0 0 8px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px;
    }
    .google-btn {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-control);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .google-btn:hover { background: var(--surface-2); }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 20px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-control);
      padding: 0 12px;
      font-size: 14px;
      color: var(--fg);
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(199,128,42,0.12); }
    .primary-btn {
      width: 100%;
      height: 40px;
      border: none;
      background: var(--accent);
      color: var(--on-accent);
      border-radius: var(--radius-control);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .primary-btn:hover { background: var(--accent-hover); }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--muted);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">S</div>
      <div class="logo-text">StudySinc</div>
    </div>
    <h1>Create an account</h1>
    <p class="subtitle">Join your classmates and start collaborating</p>
    <button class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <div class="divider">or sign up with email</div>
    <label for="name">Full name</label>
    <input id="name" type="text" placeholder="Artem Nevmerzhitskiy" />
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@university.edu" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" />
    <button class="primary-btn">Create account</button>
    <p class="footer">Already have an account? <a href="#">Sign in</a></p>
    <p class="hint">By signing up, you agree to our Terms and Privacy Policy.</p>
  </div>
</body>
</html>
